server:
  port: 8080
  servlet:
    session:
      cookie:
        # Lax is enough: in prod the SPA and the API are one origin behind nginx, and local dev is
        # localhost to localhost. Secure is left to the container, so plain-http dev still works.
        same-site: lax
#  forward-headers-strategy: native
#  ssl:
#    key-store: keystore.p12
#    key-store-password: ${KEY_STORE_PASSWORD}
#    keyStoreType: PKCS12
#    keyAlias: titlecounter
spring:
  application:
    name: team-selection
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/team-selection
    username: postgres
    password: 1234
  flyway:
    user: postgres
    password: 1234
    schemas: public
    baselineOnMigrate: true
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
      boot:
        allow_jdbc_metadata_access: false
    properties:
      jpa:
        enable_lazy_load_no_trans: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      client:
        provider:
          azure:
            issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
        registration:
          azure:
            provider: azure
            client-id: ${AZURE_CLIENT_ID}
            client-secret: ${AZURE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
              - User.Read
              # User.ReadBasic.All dropped (#23): it needs tenant admin consent (blocks every login
              # with a consent wall) and is used ONLY by PhotoService to read others' Graph photos.
              # Login matches on the id-token email claim, not Graph. Photo endpoint 403s -> falls
              # back to the placeholder (UserController.getPhoto try/catch). Re-add + get admin
              # consent if avatars are wanted.
#  cloud:
#    azure:
#      active-directory:
#        enabled: false
#        profile:
#          tenant-id: ${AZURE_TENANT_ID}
#        credential:
#          client-id: ${AZURE_CLIENT_ID}
#          client-secret: ${AZURE_CLIENT_SECRET}
#        redirect-uri-template: http://localhost:8080/login/oauth2/code/azure
#        application-type: WEB_APPLICATION
#        authorization-clients:
#          graph:
#            scopes:
#              - https://graph.microsoft.com/User.Read
#              - email
management:
  endpoints:
    web:
      exposure:
        # Только health. Prometheus и Grafana убраны из compose этого форка вместе с этой правкой:
        # метрики отложены, скрейпить эндпоинт некому, а открытым он рассказывал про внутренности
        # приложения. Вернём вместе со стеком метрик, когда он появится.
        include: health

app:
  # Кому выдать ADMIN при создании аккаунта (первый вход). Пусто — никому.
  initial-admin-emails: ${INITIAL_ADMIN_EMAILS:}

cors:
  allowed-origins: http://localhost:8080

frontend:
  url: http://localhost:5173
  login:
    url: http://localhost:5173/login

# Ключ server-to-server интеграции. Пустое значение = интеграционные ручки
# отвечают 401 всем: ненастроенный секрет не означает «ключ не нужен».
integration:
  api-key: ${INTEGRATION_API_KEY:}

# /oauth2/authorization/github
logging:
  file:
    path: resources/logs
  level:
    org.springframework.security: DEBUG
logback:
  rollingpolicy:
    max-file-size: 100MB
    max-history: 30
    total-size-cap: 300MB
