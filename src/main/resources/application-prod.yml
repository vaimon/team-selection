server:
  port: 8080
  # TLS terminates at our nginx (#33); keep forward-headers-strategy so Spring honours
  # X-Forwarded-Proto and builds https OAuth redirect URIs. App-SSL/keystore removed (#32).
  forward-headers-strategy: native
spring:
  application:
    name: team-selection
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://team-selection-postgres:5432/team-selection
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    schemas: public
    baselineOnMigrate: true
    enabled: true
    # No db/seed: a fresh prod database gets reference data (roles, technologies, project types)
    # and no demo users or teams. A database that already applied the seed fails validation here.
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      jpa:
        enable_lazy_load_no_trans: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
frontend:
  url: https://teams.pd-mmcs.ru
  login:
    url: https://teams.pd-mmcs.ru/login
cors:
  allowed-origins: https://teams.pd-mmcs.ru

logging:
  level:
    org.springframework.security: DEBUG